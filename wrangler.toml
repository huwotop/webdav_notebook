# ============================================================
# Cloudflare Pages Configuration (Git 集成专用)
# ============================================================
# 本项目仅支持通过 GitHub → Cloudflare Pages Git 集成方式部署。
# 所有环境变量、KV/R2/D1 绑定统一在【控制台网页】配置：
#
#   Settings → Environment variables
#   Settings → Functions → KV namespace bindings
#
# ⚠️ 本文件保持下列极简内容即可，不要添加 name / [[kv_namespaces]] / [vars]
#    等声明，否则 Cloudflare 控制台会锁定 Add binding 按钮并提示：
#    「此项目的绑定在通过 wrangler.toml 进行管理」。

pages_build_output_dir = "dist"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
